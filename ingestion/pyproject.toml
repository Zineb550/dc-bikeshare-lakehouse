[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bikeshare-ingest"
version = "0.1.0"
description = "Lambda handlers that land Capital Bikeshare and weather data in the S3 lake"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "requests>=2.32",
  "pyarrow>=17,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "moto[s3]>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
