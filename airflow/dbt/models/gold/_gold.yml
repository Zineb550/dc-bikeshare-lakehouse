version: 2

models:
  - name: station_availability_profile
    description: Q1. Share of time each station is empty or full, by day type and local hour.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, day_type, local_hour]
    columns:
      - name: day_type
        data_tests:
          - accepted_values:
              arguments:
                values: [weekday, weekend]
      - name: local_hour
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 23}
      - name: pct_empty
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}
      - name: pct_full
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}
      - name: n_snapshots
        data_tests:
          - in_range:
              arguments: {min_value: 8}

  - name: weather_ridership_daily
    description: Q2. Daily rides vs weather, with a dry-and-mild baseline and lost rides.
    columns:
      - name: local_date
        data_tests: [unique, not_null]
      - name: weather_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [dry, light_rain, heavy_rain]
      - name: temp_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: [cold, mild, hot]
      - name: lost_trips
        data_tests:
          - in_range:
              arguments: {min_value: 0}

  - name: rider_segments
    description: Q5. Rides by rider type, day type and local hour, with duration, e-bike share and top stations.
    data_tests:
      - unique_combination:
          arguments:
            columns: [member_casual, day_type, local_hour]
    columns:
      - name: member_casual
        data_tests:
          - accepted_values:
              arguments:
                values: [member, casual]
      - name: ebike_share
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}

  - name: station_rebalancing_priority
    description: Q3. Estimated rides lost per week to empty or full stations, ranked.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: lost_trips_per_week
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: priority_rank
        data_tests: [not_null]

  - name: inferred_truck_visits
    description: Q4. Slot-to-slot jumps in total bikes too large for riders alone (truck drop-offs and pickups).
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, slot_ts]
    columns:
      - name: visit_type
        data_tests:
          - accepted_values:
              arguments:
                values: [drop_off, pickup]
      - name: threshold
        data_tests:
          - in_range:
              arguments: {min_value: 6}

  - name: station_truck_summary
    description: Q4. Truck visits per week vs need, and which high-priority stations are underserved.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: visits_per_week
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: is_underserved
        data_tests: [not_null]

  - name: station_recovery
    description: Q6. How long stations stay empty once they run out, by day type and local hour of onset.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, day_type, onset_local_hour]
    columns:
      - name: n_streaks
        data_tests:
          - in_range:
              arguments: {min_value: 1}
      - name: median_duration_min
        data_tests:
          - in_range:
              arguments: {min_value: 15}
      - name: share_over_60_min
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}
